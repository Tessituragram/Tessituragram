name: Test and sync backend

on:
  push:
    branches: [web-dev]
    paths:
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: pytest tests/

  sync:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build backend-only snapshot
        run: |
          ORIG=$(git rev-parse HEAD)
          git checkout --orphan backend-snapshot
          git rm -r --cached . > /dev/null
          git clean -fdx
          git checkout "$ORIG" -- README.md LICENSE THIRD_PARTY_LICENSES requirements.txt .gitignore main.py main.spec main main.exe src data conftest.py .coverage tests
          git add README.md LICENSE THIRD_PARTY_LICENSES requirements.txt .gitignore main.py main.spec main main.exe src data conftest.py .coverage tests
          git status
          git commit -m "Backend-only snapshot from web-dev ($ORIG)"

      - name: Push snapshot to main
        run: git push origin backend-snapshot:main --force