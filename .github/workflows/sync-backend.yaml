name: Sync backend to main

on:
  push:
    branches: [web-dev]
    paths:
      - 'src/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for subtree split

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Split backend folder into its own branch
        run: |
          git subtree split --prefix=src -b backend-split

      - name: Push split branch to main
        run: |
          git push origin backend-split:main --force