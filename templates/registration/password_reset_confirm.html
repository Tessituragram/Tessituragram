{% extends "base.html" %}
{% block content %}
<h1>Set a new password</h1>

{% if validlink %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Change password</button>
</form>
{% else %}
<p class="b1">This link is invalid or has expired. <a href="{% url 'password_reset' %}">Request a new one</a>.</p>
{% endif %}
{% endblock %}
