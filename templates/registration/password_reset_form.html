{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<h1>Reset your password</h1>
<p class="b1">Enter your email and we'll send you a link to reset your password.</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send reset link</button>
</form>
{% endblock %}
